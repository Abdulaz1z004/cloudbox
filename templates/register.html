<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CloudBox – Create Account</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#0D9488"/><path d="M10 26 Q10 18 20 18 Q22 12 28 14 Q34 14 34 20 Q38 20 38 25 L10 25Z" fill="white" opacity="0.9"/><rect x="11" y="25" width="22" height="3" rx="1.5" fill="white"/></svg>
      <span class="brand-name">CloudBox</span>
    </div>
    <p class="auth-subtitle">CREATE ACCOUNT</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="form-group">
        <input type="text" name="full_name" placeholder="Full Name" class="form-control"/>
      </div>
      <div class="form-group">
        <input type="email" name="email" placeholder="email@example.com" required class="form-control"/>
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="Password" required class="form-control"/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
</body>
</html>
