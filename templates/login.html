<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CloudBox – Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#0D9488"/><path d="M10 26 Q10 18 20 18 Q22 12 28 14 Q34 14 34 20 Q38 20 38 25 L10 25Z" fill="white" opacity="0.9"/><rect x="11" y="25" width="22" height="3" rx="1.5" fill="white"/></svg>
      <span class="brand-name">CloudBox</span>
    </div>
    <p class="auth-subtitle">LOGIN</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert alert-success">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}
    <form method="post" autocomplete="off">
      <div class="form-group">
        <input type="email" name="email" placeholder="email@example.com" required class="form-control"/>
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="••••••••" required class="form-control"/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign in</button>
    </form>
    <p class="auth-footer">New user? <a href="{{ url_for('register') }}">Create account</a></p>
  </div>
</div>
</body>
</html>
